plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
    id 'net.neoforged.moddev' version '2.0.123' apply false
    id "com.modrinth.minotaur" version "2.+" apply false
}

group = project.maven_group
version = project.mod_version

subprojects {
    apply plugin: 'java-library'

    group = rootProject.group
    version = rootProject.version

    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }
}

tasks.register("modrinth") {
    group = "publishing"
    description = "Publishes Fabric and NeoForge builds to Modrinth."
    dependsOn(":fabric:modrinth", ":neoforge:modrinth")
}
